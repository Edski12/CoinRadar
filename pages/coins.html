<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Coin Radar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
</head>

<body>
    <!-- Mobile top navbar with burger menu (visible below lg) -->
    <nav class="navbar navbar-light bg-light border-bottom d-lg-none">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center mb-0" href="../index.html">
                <img src="../assets/images/coinradarIcon.png" alt="Coin Radar logo" class="me-2"
                    style="width: 32px; height: 32px; object-fit: cover;">
                <span class="fw-bold fst-italic">Coin Radar</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu"
                aria-controls="sidebarMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
        <div class="collapse" id="sidebarMenu">
            <ul class="nav flex-column sidebar-nav p-3">
                <li class="nav-item mb-2">
                    <a class="nav-link text-dark" href="Coins.html" data-nav="coins" data-bs-toggle="collapse"
                        data-bs-target="#sidebarMenu">
                        <span class="nav-indicator" aria-hidden="true">←</span>
                        <span>Coins</span>
                    </a>
                </li>
                <li class="nav-item mb-2">
                    <a class="nav-link text-dark" href="watchlist.html" data-nav="watchlist" data-bs-toggle="collapse"
                        data-bs-target="#sidebarMenu">
                        <span class="nav-indicator" aria-hidden="true">←</span>
                        <span>Watchlist</span>
                    </a>
                </li>
                <li class="nav-item mb-2">
                    <a class="nav-link text-dark" href="settings.html" data-nav="settings" data-bs-toggle="collapse"
                        data-bs-target="#sidebarMenu">
                        <span class="nav-indicator" aria-hidden="true">←</span>
                        <span>Settings</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row min-vh-100">
            <!-- Sidebar: hidden on small screens, visible from lg up -->
            <aside class="col-lg-2 bg-light border-end p-4 d-none d-lg-block">
                <div class="d-flex align-items-center mb-4">
                    <img src="../assets/images/coinradarIcon.png" alt="Coin Radar logo" class="me-2" style="width: 40px; height: 40px; object-fit: cover;">
                    <div class="fw-bold h5 mb-0 fst-italic">
                        <a href="../index.html" class="nav-link">Coin Radar</a>
                    </div>
                </div>
                <ul class="nav flex-column sidebar-nav">
                    <li class="nav-item mb-2">
                        <a class="nav-link text-dark" href="Coins.html" data-nav="coins">
                            <span class="nav-indicator" aria-hidden="true">←</span>
                            <span>Coins</span>
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link text-dark" href="watchlist.html" data-nav="watchlist">
                            <span class="nav-indicator" aria-hidden="true">←</span>
                            <span>Watchlist</span>
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link text-dark" href="settings.html" data-nav="settings">
                            <span class="nav-indicator" aria-hidden="true">←</span>
                            <span>Settings</span>
                        </a>
                    </li>
                </ul>
            </aside>

            <div class="col-12 col-lg-9 col-xl-9 p-3 p-lg-4">
                <h2 class="mb-3">Crypto Coins</h2>
                <p class="text-muted">Live market data from Binance.</p>

                <div class="mb-3">
                    <input type="text" id="coinSearch" class="form-control" placeholder="Search coins..." />
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Symbol</th>
                                <th>Price</th>
                                <th class="d-none d-md-table-cell">24h Change</th>
                                <th class="d-none d-md-table-cell">24h Volume</th>
                                <th>24h Chart</th>
                            </tr>
                        </thead>
                        <tbody id="coinsTableBody">
                            <tr>
                                <td colspan="5" class="text-center text-muted">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentPage = window.location.pathname.split('/').pop().toLowerCase();
            document.querySelectorAll('.sidebar-nav .nav-link').forEach(link => {
                const target = link.getAttribute('href').split('/').pop().split('?')[0].toLowerCase();
                const isActive = currentPage === target;
                link.classList.toggle('active', isActive);

                link.addEventListener('click', (event) => {
                    if (link.classList.contains('active')) {
                        event.preventDefault();
                        if (document.referrer && document.referrer !== window.location.href) {
                            window.history.back();
                        } else {
                            window.location.href = link.getAttribute('href');
                        }
                    }
                });
            });
        });

        let allCoins = [];
        const chartInstances = {};

        async function fetchChartData(symbol) {
            try {
                const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1h&limit=24`);
                if (!response.ok) return null;
                const data = await response.json();
                return data.map(item => ({
                    time: new Date(item[0]).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit' }),
                    close: Number(item[4])
                }));
            } catch (error) {
                return null;
            }
        }

        async function renderCharts(symbols) {
            for (const symbol of symbols) {
                const chartData = await fetchChartData(symbol);
                if (!chartData) continue;

                const canvasId = `chart-${symbol}`;
                const canvas = document.getElementById(canvasId);
                if (!canvas) continue;

                const closes = chartData.map(d => d.close);
                const minPrice = Math.min(...closes);
                const maxPrice = Math.max(...closes);
                const isPositive = closes[closes.length - 1] >= closes[0];

                if (chartInstances[symbol]) {
                    chartInstances[symbol].destroy();
                }

                chartInstances[symbol] = new Chart(canvas, {
                    type: 'line',
                    data: {
                        labels: chartData.map(d => d.time),
                        datasets: [{
                            label: symbol,
                            data: closes,
                            borderColor: isPositive ? '#16a34a' : '#dc2626',
                            borderWidth: 2,
                            fill: true,
                            backgroundColor: isPositive ? 'rgba(22, 163, 74, 0.1)' : 'rgba(220, 38, 38, 0.1)',
                            tension: 0.3,
                            pointRadius: 0,
                            pointHoverRadius: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            y: {
                                min: minPrice * 0.999,
                                max: maxPrice * 1.001,
                                display: false
                            },
                            x: { display: false }
                        }
                    }
                });
            }
        }

        function renderCoins(list) {
            const tableBody = document.getElementById('coinsTableBody');

            if (!list.length) {
                tableBody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No matching coins found.</td></tr>';
                return;
            }

            tableBody.innerHTML = list.map(item => {
                const price = Number(item.lastPrice).toFixed(2);
                const change = Number(item.priceChangePercent).toFixed(2);
                const volume = Number(item.volume).toLocaleString();
                const changeClass = change >= 0 ? 'text-success' : 'text-danger';

                return `
                    <tr class="coin-row" data-symbol="${item.symbol}" style="cursor: pointer;">
                        <td><strong>${item.symbol}</strong></td>
                        <td>$${price}</td>
                        <td class="d-none d-md-table-cell ${changeClass}">${change}%</td>
                        <td class="d-none d-md-table-cell">${volume}</td>
                        <td style=\"width: 16.67%; padding: 0.5rem 0.25rem;\"><canvas id=\"chart-${item.symbol}\" height=\"30\" style=\"max-width: 100%;\"></canvas></td>
                    </tr>
                `;
            }).join('');

            document.querySelectorAll('.coin-row').forEach(row => {
                row.addEventListener('click', (e) => {
                    if (e.target.closest('canvas')) return;
                    const symbol = row.getAttribute('data-symbol');
                    window.location.href = `coin-details.html?symbol=${encodeURIComponent(symbol)}`;
                });
            });

            renderCharts(list.map(coin => coin.symbol));
        }

        async function loadCoins() {
            const tableBody = document.getElementById('coinsTableBody');

            try {
                const response = await fetch('https://api.binance.com/api/v3/ticker/24hr');
                if (!response.ok) throw new Error('Unable to fetch data');

                const data = await response.json();
                allCoins = data
                    .filter(item => item.symbol.endsWith('USDT') && !item.symbol.includes('UP') && !item.symbol.includes('DOWN'))
                    .sort((a, b) => Number(b.quoteVolume) - Number(a.quoteVolume));

                renderCoins(allCoins);
            } catch (error) {
                tableBody.innerHTML = '<tr><td colspan="5" class="text-center text-danger">Failed to load Binance data.</td></tr>';
            }
        }

        document.getElementById('coinSearch').addEventListener('input', function () {
            const query = this.value.toLowerCase();
            const filtered = allCoins.filter(item => item.symbol.toLowerCase().includes(query));
            renderCoins(filtered);
        });

        loadCoins();
        setInterval(loadCoins, 60000);
    </script>
</body>

</html>
